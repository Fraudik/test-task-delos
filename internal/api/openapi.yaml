openapi: 3.0.3
info:
  title: USDT deposits
  version: 1.0.0
  description: |
    Partner API (invoices, balance) and simulator controls for running the deposit scenario by hand.
    Amounts are decimal strings with up to 6 fraction digits.
security:
  - apiKey: []
paths:
  /v1/invoices:
    post:
      tags: [partner]
      summary: Create an invoice (idempotent by Idempotency-Key)
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      responses:
        "201": {description: Invoice created, content: {application/json: {schema: {$ref: "#/components/schemas/Invoice"}}}}
        "200": {description: Invoice already created with this key, content: {application/json: {schema: {$ref: "#/components/schemas/Invoice"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/invoices/{id}:
    get:
      tags: [partner]
      summary: Get invoice status and its deposits
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200": {description: Invoice, content: {application/json: {schema: {$ref: "#/components/schemas/Invoice"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/balance:
    get:
      tags: [partner]
      summary: Get partner balance
      responses:
        "200": {description: Balance, content: {application/json: {schema: {$ref: "#/components/schemas/Balance"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /sim/transfers:
    post:
      tags: [simulator]
      summary: Send a USDT transfer (mined into a new block)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, amount]
              properties:
                from: {type: string, example: "0x1111111111111111111111111111111111111111"}
                to: {type: string, description: Invoice address}
                amount: {type: string, example: "100.5"}
      responses:
        "201":
          description: Transfer mined
          content:
            application/json:
              schema:
                type: object
                properties:
                  tx_hash: {type: string}
                  block_number: {type: integer}
                  block_hash: {type: string}
        "400": {$ref: "#/components/responses/Error"}
  /sim/blocks:
    post:
      tags: [simulator]
      summary: Mine empty blocks (adds confirmations)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: {type: integer, example: 5}
      responses:
        "200": {$ref: "#/components/responses/Head"}
        "400": {$ref: "#/components/responses/Error"}
  /sim/reorg:
    post:
      tags: [simulator]
      summary: Drop the last `depth` blocks and mine depth+1 new ones (optionally re-including dropped transfers)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depth]
              properties:
                depth: {type: integer, example: 2}
                reinclude: {type: boolean, description: Mine transfers of dropped blocks again into the first new block, default: false}
      responses:
        "200": {$ref: "#/components/responses/Head"}
        "400": {$ref: "#/components/responses/Error"}
  /sim/rescan:
    post:
      tags: [simulator]
      summary: Rewind the scanner cursor so blocks are processed again
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_block]
              properties:
                from_block: {type: integer, example: 0}
      responses:
        "200":
          description: Cursor rewound
          content:
            application/json:
              schema:
                type: object
                properties:
                  rewound: {type: boolean}
  /sim/aml:
    put:
      tags: [simulator]
      summary: Make the AML mock available or failing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: {type: boolean}
      responses:
        "200": {description: AML availability set}
  /sim/head:
    get:
      tags: [simulator]
      summary: Current head block
      security: []
      responses:
        "200": {$ref: "#/components/responses/Head"}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
    Head:
      description: Head block
      content:
        application/json:
          schema:
            type: object
            properties:
              head: {type: integer}
  schemas:
    Invoice:
      type: object
      properties:
        id: {type: integer, format: int64}
        address: {type: string}
        status:
          type: string
          enum: [awaiting_payment, processing, paid, refunded, needs_review]
        created_at: {type: string, format: date-time}
        deposits:
          type: array
          items:
            type: object
            properties:
              tx_hash: {type: string}
              log_index: {type: integer}
              block_number: {type: integer}
              block_hash: {type: string}
              amount: {type: string, example: "100.000000"}
              status:
                type: string
                enum: [pending, orphaned, confirmed, credited, refunded, needs_review]
              detected_at: {type: string, format: date-time}
    Balance:
      type: object
      properties:
        currency: {type: string, example: USDT}
        available: {type: string, example: "98.500000"}
        on_hold: {type: string, example: "0.000000"}
