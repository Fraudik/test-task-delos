services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dellos
      POSTGRES_PASSWORD: dellos
      POSTGRES_DB: dellos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dellos -d dellos"]
      interval: 2s
      timeout: 3s
      retries: 30
