version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
      - column: ledger_accounts.balance
        go_type: &amount
          import: test-task-dellos/internal/money
          type: Amount
      - column: ledger_entries.amount
        go_type: *amount
      - column: deposits.amount
        go_type: *amount
      - column: refunds.amount
        go_type: *amount
      - column: partners.fee_fixed
        go_type: *amount
      - column: invoices.amount
        go_type: *amount
      - column: invoices.fee_fixed
        go_type: *amount
sql:
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/ledger/queries.sql
    strict_function_checks: true
    gen:
      go:
        package: ledgerdb
        out: internal/ledger/ledgerdb
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/processing/deposit/queries.sql
    strict_function_checks: true
    gen:
      go:
